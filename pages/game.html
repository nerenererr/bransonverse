<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Bransonverse - Partida</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Barrio&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../src/css/main.css">
</head>
<body>
    <main class="game">
        <section class="machine" aria-label="Máquina de gancho">
            <div class="machine__lights" aria-hidden="true">
                <span class="light"></span>
                <span class="light"></span>
                <span class="light"></span>
                <span class="light"></span>
                <span class="light"></span>
                <span class="light"></span>
                <span class="light"></span>
                <span class="light"></span>
                <span class="light"></span>
                <span class="light"></span>
            </div>

            <div class="machine__play-area">
                <div class="claw">
                    <img class="claw__image" src="https://res.cloudinary.com/da9tytxsu/image/upload/f_auto,q_auto/v1794919052/extended_claw_qmld36.png" alt="Garra de la máquina">
                </div>
                <div class="machine__dolls"></div>
            </div>

            <div class="machine__front-bar" aria-hidden="true"></div>
            <div class="machine__joystick-cover" aria-hidden="true"></div>

            <button type="button" class="joystick" aria-label="Mover la garra (izquierda o derecha)"></button>
            <button type="button" class="machine__button" aria-label="Soltar la garra"></button>
        </section>
    </main>

    <script src="../src/js/machine.js"></script>
    <script src="../src/js/game.js"></script>
</body>
</html>
